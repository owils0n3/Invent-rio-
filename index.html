<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Acervo Pessoal</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Acervo" />
  <meta name="theme-color" content="#F3F4F6" />

  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%231E293B'/%3E%3Ctext x='50%25' y='54%25' font-size='260' text-anchor='middle' dominant-baseline='middle'%3E📦%3C/text%3E%3C/svg%3E">

  <style>
    :root {
      --bg-app: #F3F4F6; /* Cinza gelo limpo */
      --bg-card: #FFFFFF;
      --text-main: #1F2937;
      --text-sub: #6B7280;
      
      --primary: #2563EB; /* Azul vibrante financeiro */
      --primary-hover: #1D4ED8;
      --dark-accent: #1E293B; /* Cinza chumbo/marinho */
      
      --success: #10B981;
      --danger: #EF4444;
      
      --border: #E5E7EB;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

    body { background-color: var(--bg-app); color: var(--text-main); min-height: 100vh; padding-bottom: 70px; }

    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: calc(env(safe-area-inset-top) + 16px) 20px 16px;
    }

    .header-title { font-size: 1.25rem; font-weight: 700; color: var(--dark-accent); margin-bottom: 16px; }

    .segmented-control {
      display: flex; background: #F1F5F9; border-radius: 10px; padding: 3px; border: 1px solid var(--border);
    }
    .segment {
      flex: 1; text-align: center; padding: 8px 0; font-size: 0.85rem; font-weight: 600;
      color: var(--text-sub); border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    .segment.active { background: var(--bg-card); color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

    .container { max-width: 720px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }

    .card {
      background: var(--bg-card); border-radius: 16px; padding: 20px;
      border: 1px solid var(--border); box-shadow: var(--shadow);
    }

    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-sub); margin-bottom: 8px; }

    input, select {
      width: 100%; height: 46px; padding: 0 14px; font-size: 1rem;
      border: 1px solid var(--border); border-radius: 10px;
      background: #F9FAFB; color: var(--text-main); outline: none; margin-bottom: 16px;
      -webkit-appearance: none; appearance: none;
    }
    input:focus, select:focus { border-color: var(--primary); background: #FFFFFF; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

    .btn {
      width: 100%; height: 46px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:active { opacity: 0.8; transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: #FFFFFF; }
    .btn-dark { background: var(--dark-accent); color: #FFFFFF; }
    .btn-success { background: var(--success); color: #FFFFFF; }
    .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border); }
    .btn-sm { height: 36px; font-size: 0.85rem; padding: 0 16px; width: auto; border-radius: 8px; }

    /* Estrutura das Caixas de Categoria */
    .category-box {
      background: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .category-header {
      background: #F8FAFC;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      color: var(--dark-accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .category-count {
      background: var(--border);
      color: var(--text-sub);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 99px;
    }
    .category-content {
      display: flex;
      flex-direction: column;
    }

    /* Itens dentro da categoria */
    .item-row {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-row:last-child { border-bottom: none; }
    
    .item-info { flex: 1; }
    .item-title { font-size: 1rem; font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
    .item-meta { font-size: 0.85rem; color: var(--text-sub); }
    .item-meta strong { color: var(--dark-accent); }

    .item-actions { display: flex; gap: 8px; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); z-index: 100;
      display: none; align-items: center; justify-content: center; padding: 20px;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--bg-card); width: 100%; max-width: 380px;
      border-radius: 20px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; color: var(--dark-accent); }
    .modal-actions { display: flex; gap: 12px; margin-top: 24px; }

    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--dark-accent); color: #FFFFFF; padding: 14px 24px;
      border-radius: 99px; font-size: 0.9rem; font-weight: 600; transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 300;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    
    .flex-row { display: flex; gap: 10px; align-items: flex-start; }
  </style>
</head>
<body>

  <header>
    <div style="max-width: 720px; margin: 0 auto;">
      <div class="header-title">📦 Controle de Acervo</div>
      <div class="segmented-control">
        <div class="segment active" id="tab-casa" onclick="mudarAba('casa')">Em Casa</div>
        <div class="segment" id="tab-fora" onclick="mudarAba('fora')">Emprestados</div>
      </div>
    </div>
  </header>

  <div class="container">
    
    <!-- Painel de Cadastro -->
    <div class="card" id="card-adicionar">
      <label>Novo Item</label>
      <input type="text" id="novoItemNome" placeholder="O que você quer guardar?" autocomplete="off" />
      
      <label>Categoria</label>
      <div class="flex-row">
        <select id="selectCategoria" style="flex: 1;">
          <option value="" disabled selected>Selecione ou crie...</option>
        </select>
        <button class="btn btn-outline" style="width: auto; padding: 0 16px; height: 46px;" onclick="criarNovaCategoria()">+ Criar</button>
      </div>
      
      <button class="btn btn-dark" onclick="adicionarItem()">Adicionar ao Acervo</button>
    </div>

    <!-- Área onde as categorias e itens serão renderizados -->
    <div id="areaAcervo" style="display: flex; flex-direction: column; gap: 20px;"></div>

  </div>

  <!-- Modal Emprestar -->
  <div class="modal-overlay" id="modalEmprestar">
    <div class="modal-content">
      <div class="modal-title">Registrar Saída</div>
      
      <label>Para quem você está emprestando?</label>
      <input type="text" id="empNome" placeholder="Nome da pessoa" autocomplete="off" />
      
      <label>Data de saída</label>
      <input type="date" id="empData" />
      
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="confirmarEmprestimo()">Registrar Saída</button>
      </div>
    </div>
  </div>

  <div id="toast">Ação concluída!</div>

  <script>
    const STORAGE_ITENS = 'acervo_itens_v2';
    const STORAGE_CATS = 'acervo_categorias_v2';
    
    let inventario = JSON.parse(localStorage.getItem(STORAGE_ITENS)) || [];
    let categorias = JSON.parse(localStorage.getItem(STORAGE_CATS)) || ['Geral'];
    
    let abaAtual = 'casa';
    let itemEmEdicao = null;

    document.getElementById('empData').value = new Date().toISOString().split('T')[0];

    function salvarDados() {
      localStorage.setItem(STORAGE_ITENS, JSON.stringify(inventario));
      localStorage.setItem(STORAGE_CATS, JSON.stringify(categorias));
      atualizarSelectCategorias();
      renderizarInterface();
    }

    function atualizarSelectCategorias() {
      const select = document.getElementById('selectCategoria');
      const valAtual = select.value;
      
      select.innerHTML = '<option value="" disabled>Selecione a categoria...</option>';
      categorias.forEach(cat => {
        select.innerHTML += `<option value="${cat}">${cat}</option>`;
      });
      
      if (categorias.includes(valAtual)) {
        select.value = valAtual;
      } else if (categorias.length > 0) {
        select.value = categorias[0];
      }
    }

    function criarNovaCategoria() {
      const nova = prompt('Digite o nome da nova categoria:');
      if (nova && nova.trim() !== '') {
        const nomeFormatado = nova.trim();
        if (!categorias.includes(nomeFormatado)) {
          categorias.push(nomeFormatado);
          salvarDados();
          document.getElementById('selectCategoria').value = nomeFormatado;
          mostrarToast('📁 Categoria criada!');
        } else {
          mostrarToast('⚠️ Esta categoria já existe.');
        }
      }
    }

    function adicionarItem() {
      const nome = document.getElementById('novoItemNome').value.trim();
      const cat = document.getElementById('selectCategoria').value;
      
      if (!nome) { mostrarToast('⚠️ Digite o nome do item'); return; }
      if (!cat) { mostrarToast('⚠️ Selecione ou crie uma categoria'); return; }

      inventario.unshift({
        id: Date.now().toString(),
        nome: nome,
        categoria: cat,
        status: 'casa'
      });

      document.getElementById('novoItemNome').value = '';
      salvarDados();
      mostrarToast('✅ Item adicionado!');
    }

    function mudarAba(aba) {
      abaAtual = aba;
      document.getElementById('tab-casa').classList.toggle('active', aba === 'casa');
      document.getElementById('tab-fora').classList.toggle('active', aba === 'fora');
      document.getElementById('card-adicionar').style.display = aba === 'casa' ? 'block' : 'none';
      renderizarInterface();
    }

    function renderizarInterface() {
      const area = document.getElementById('areaAcervo');
      area.innerHTML = '';

      const itensFiltrados = inventario.filter(i => i.status === abaAtual);

      if (itensFiltrados.length === 0) {
        area.innerHTML = `<p style="text-align:center; color:var(--text-sub); padding: 40px 0; font-weight: 500;">Nenhum item encontrado.</p>`;
        return;
      }

      // Se a aba for "Em Casa", renderiza no formato de Caixas por Categoria
      if (abaAtual === 'casa') {
        categorias.forEach(cat => {
          const itensDaCategoria = itensFiltrados.filter(i => i.categoria === cat);
          
          if (itensDaCategoria.length > 0) {
            let htmlCaixa = `
              <div class="category-box">
                <div class="category-header">
                  <span>${cat}</span>
                  <span class="category-count">${itensDaCategoria.length}</span>
                </div>
                <div class="category-content">
            `;

            itensDaCategoria.forEach(item => {
              htmlCaixa += `
                <div class="item-row">
                  <div class="item-info">
                    <div class="item-title">${item.nome}</div>
                  </div>
                  <div class="item-actions">
                    <button class="btn btn-outline btn-sm" style="color:var(--danger); border-color:var(--border);" onclick="apagarItem('${item.id}')">Excluir</button>
                    <button class="btn btn-primary btn-sm" onclick="abrirModalEmprestar('${item.id}')">Emprestar</button>
                  </div>
                </div>
              `;
            });

            htmlCaixa += `</div></div>`;
            area.innerHTML += htmlCaixa;
          }
        });
      } 
      // Se a aba for "Emprestados", renderiza uma lista focada em quem está com o item
      else {
        let htmlEmprestados = `<div class="category-box"><div class="category-content">`;
        
        itensFiltrados.forEach(item => {
          htmlEmprestados += `
            <div class="item-row">
              <div class="item-info">
                <div class="item-title">${item.nome} <span style="font-size:0.75rem; color:var(--text-sub); font-weight:normal;">(${item.categoria})</span></div>
                <div class="item-meta">
                  Com: <strong>${item.emprestadoPara}</strong> <br/>
                  Saiu: ${formatarData(item.dataSaida)}
                </div>
              </div>
              <div class="item-actions">
                <button class="btn btn-success btn-sm" onclick="receberItem('${item.id}')">Devolvido</button>
              </div>
            </div>
          `;
        });
        
        htmlEmprestados += `</div></div>`;
        area.innerHTML = htmlEmprestados;
      }
    }

    function abrirModalEmprestar(id) {
      itemEmEdicao = id;
      document.getElementById('empNome').value = '';
      document.getElementById('modalEmprestar').classList.add('active');
    }

    function fecharModal() {
      document.getElementById('modalEmprestar').classList.remove('active');
      itemEmEdicao = null;
    }

    function confirmarEmprestimo() {
      const pessoa = document.getElementById('empNome').value.trim();
      const data = document.getElementById('empData').value;

      if (!pessoa || !data) { mostrarToast('⚠️ Preencha nome e data'); return; }

      const item = inventario.find(i => i.id === itemEmEdicao);
      if (item) {
        item.status = 'fora';
        item.emprestadoPara = pessoa;
        item.dataSaida = data;
        
        salvarDados();
        fecharModal();
        mostrarToast('📤 Item emprestado!');
      }
    }

    function receberItem(id) {
      const item = inventario.find(i => i.id === id);
      if (item) {
        item.status = 'casa';
        delete item.emprestadoPara;
        delete item.dataSaida;
        salvarDados();
        mostrarToast('📥 Item guardado em casa');
      }
    }

    function apagarItem(id) {
      if(confirm('Apagar este item definitivamente?')) {
        inventario = inventario.filter(i => i.id !== id);
        salvarDados();
        mostrarToast('🗑️ Removido');
      }
    }

    function formatarData(dataIso) {
      if (!dataIso) return '';
      const [a, m, d] = dataIso.split('-');
      return `${d}/${m}/${a}`;
    }

    let toastT;
    function mostrarToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(toastT);
      toastT = setTimeout(() => t.classList.remove('show'), 2500);
    }

    atualizarSelectCategorias();
    renderizarInterface();
  </script>
</body>
</html>
